<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security - Admin</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/security.css">
</head>
<body data-page="security">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div class="mobile-top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h1>Security</h1>
      <button id="theme-toggle" class="btn-secondary btn-sm">🌓</button>
    </div>
    <div class="page-header">
      <h1>Security Monitoring</h1>
      <div class="header-actions">
        <button id="theme-toggle-desktop" class="btn-secondary btn-sm">🌓 Theme</button>
        <button id="logout-btn" class="btn-secondary btn-sm">Logout</button>
      </div>
    </div>

    <div class="card">
      <h3>Security Logs</h3>
      <div id="logs-table-container"></div>
    </div>

    <div class="card">
      <h3>Locked Accounts</h3>
      <div id="locked-users-container"></div>
    </div>
  </div>

  <script type="module">
    import { initApp } from '../scripts/admin.js';
    import { loadSecurityLogs, loadLockedUsers } from '../scripts/admin-security.js';

    initApp();
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
    document.getElementById('theme-toggle-desktop')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('adminTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    loadSecurityLogs();
    loadLockedUsers();
  </script>
</body>
</html>
