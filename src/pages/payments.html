<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments - Admin</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/payments.css">
</head>
<body data-page="payments">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div class="mobile-top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h1>Payments</h1>
      <button id="theme-toggle" class="btn-secondary btn-sm">🌓</button>
    </div>
    <div class="page-header">
      <h1>Payment Administration</h1>
      <div class="header-actions">
        <button id="theme-toggle-desktop" class="btn-secondary btn-sm">🌓 Theme</button>
        <button id="logout-btn" class="btn-secondary btn-sm">Logout</button>
      </div>
    </div>

    <div class="card actions">
      <button id="manual-payment-btn" class="btn-primary">Record Manual Payment</button>
      <button id="export-csv-btn" class="btn-secondary">Export CSV</button>
    </div>

    <div class="card">
      <div id="payments-table-container"></div>
    </div>
  </div>

  <script type="module">
    import { initApp } from '../scripts/admin.js';
    import { loadPayments, recordManualPayment, exportPayments } from '../scripts/admin-payments.js';

    initApp();
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
    document.getElementById('theme-toggle-desktop')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('adminTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    loadPayments();

    document.getElementById('manual-payment-btn').addEventListener('click', () => {
      const userId = prompt('User ID:');
      const amount = parseFloat(prompt('Amount (KES):'));
      const reference = prompt('Reference:');
      const planName = prompt('Plan name:');
      if (userId && amount > 0 && reference && planName) {
        recordManualPayment(userId, amount, reference, planName);
      }
    });

    document.getElementById('export-csv-btn').addEventListener('click', () => exportPayments('csv'));
  </script>
</body>
</html>
