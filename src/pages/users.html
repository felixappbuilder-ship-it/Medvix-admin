<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Admin</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/users.css">
</head>
<body data-page="users">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <!-- Mobile top bar -->
    <div class="mobile-top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h1>Users</h1>
      <button id="theme-toggle" class="btn-secondary btn-sm">🌓</button>
    </div>

    <!-- Desktop header -->
    <div class="page-header">
      <h1>User Management</h1>
      <div class="header-actions">
        <button id="theme-toggle-desktop" class="btn-secondary btn-sm">🌓 Theme</button>
        <button id="logout-btn" class="btn-secondary btn-sm">Logout</button>
      </div>
    </div>

    <!-- Filters & Search -->
    <div class="card filters-bar">
      <div class="search-box">
        <input type="text" id="user-search" placeholder="Search by name, email or phone..." autocomplete="off">
        <button class="btn-sm btn-secondary" id="clear-search" style="display:none;">✕</button>
      </div>
      <div class="filter-chips">
        <select id="status-filter">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="expired">Expired</option>
          <option value="locked">Locked</option>
        </select>
        <select id="plan-filter">
          <option value="">All Plans</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="yearly">Yearly</option>
          <option value="trial">Trial</option>
        </select>
        <select id="locked-filter">
          <option value="">Any Lock</option>
          <option value="true">Locked only</option>
          <option value="false">Not locked</option>
        </select>
      </div>
    </div>

    <!-- Bulk Actions Bar (hidden) -->
    <div class="card bulk-actions" id="bulk-actions" style="display: none;">
      <span id="selected-count">0 selected</span>
      <div class="bulk-buttons">
        <button id="bulk-lock-btn" class="btn-warning btn-sm">Lock</button>
        <button id="bulk-unlock-btn" class="btn-success btn-sm">Unlock</button>
        <button id="bulk-logout-btn" class="btn-secondary btn-sm">Force Logout</button>
        <button id="bulk-delete-btn" class="btn-danger btn-sm">Delete</button>
        <button id="bulk-clear-btn" class="btn-secondary btn-sm">Clear</button>
      </div>
    </div>

    <!-- Users Table -->
    <div class="card">
      <div id="user-table-container"></div>
    </div>
  </div>

  <script type="module">
    import { initApp } from '../scripts/admin.js';
    import { initUsersPage } from '../scripts/admin-users.js';

    initApp();
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
    document.getElementById('theme-toggle-desktop')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('adminTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });
    initUsersPage();
  </script>
</body>
</html>
