<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - Admin</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/logs.css">
</head>
<body data-page="logs">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div class="mobile-top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h1>Audit Logs</h1>
      <button id="theme-toggle" class="btn-secondary btn-sm">🌓</button>
    </div>
    <div class="page-header">
      <h1>Admin Action Logs</h1>
      <div class="header-actions">
        <button id="theme-toggle-desktop" class="btn-secondary btn-sm">🌓 Theme</button>
        <button id="logout-btn" class="btn-secondary btn-sm">Logout</button>
      </div>
    </div>

    <div class="card">
      <div id="audit-logs-table"></div>
    </div>
  </div>

  <script type="module">
    import { initApp } from '../scripts/admin.js';
    import { query } from '../scripts/admin-api.js';
    import { showToast, formatDate } from '../scripts/admin-utils.js';

    initApp();
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
    document.getElementById('theme-toggle-desktop')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('adminTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    async function loadLogs() {
      try {
        const data = await query('admin/queries:adminGetAuditLogs');
        const container = document.getElementById('audit-logs-table');
        if (data.logs && data.logs.length > 0) {
          let html = '<table class="admin-table"><thead><tr><th>Timestamp</th><th>Admin</th><th>Action</th><th>Details</th></tr></thead><tbody>';
          data.logs.forEach(log => {
            html += `<tr><td>${formatDate(log.timestamp)}</td><td>${log.adminId}</td><td>${log.action}</td><td>${log.details || ''}</td></tr>`;
          });
          html += '</tbody></table>';
          container.innerHTML = html;
        } else {
          container.innerHTML = '<p>No audit logs found.</p>';
        }
      } catch (err) { showToast(err.message, 'error'); }
    }
    loadLogs();
  </script>
</body>
</html>
