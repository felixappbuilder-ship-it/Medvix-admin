<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login -MedHub</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page" data-page="login">
  <div class="login-container">
    <div class="login-card card">
      <img src="/assets/logo.png" alt="Logo" class="login-logo">
      <h1>Admin Portal</h1>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary w-full">Login</button>
      </form>
      <p class="forgot-link"><a href="#" id="forgot-password-link">Forgot password?</a></p>
    </div>
    <!-- Forgot password flow (hidden by default) -->
    <div class="login-card card" id="forgot-password-card" style="display:none;">
      <h2>Reset Password</h2>
      <div id="step-email">
        <div class="form-group">
          <label for="reset-email">Enter your email</label>
          <input type="email" id="reset-email">
        </div>
        <button id="get-questions-btn" class="btn-primary">Get Security Questions</button>
      </div>
      <div id="step-questions" style="display:none;">
        <p>Answer your security questions:</p>
        <div id="questions-container"></div>
        <button id="verify-answers-btn" class="btn-primary">Verify Answers</button>
      </div>
      <div id="step-new-password" style="display:none;">
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password">
        </div>
        <button id="reset-password-btn" class="btn-primary">Reset Password</button>
      </div>
      <p class="forgot-link"><a href="#" id="back-to-login">Back to login</a></p>
    </div>
  </div>

  <!-- ============================================================
       DEVICE LIMIT MODAL
       Shown when login() throws DEVICE_LIMIT_REACHED. The admin
       must pick a device to remove before the login can complete.
       Hidden by default; toggled via inline style by the script.
       ============================================================ -->
  <div id="device-limit-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="device-limit-title">Device limit reached</h3>
        <button id="device-limit-close" class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="device-limit-message"></div>
        <ul id="device-limit-list" class="device-limit-list"></ul>
      </div>
      <div class="modal-footer">
        <button id="device-limit-cancel" class="btn-secondary" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      login,
      forgotPassword,
      verifyAnswers,
      resetPassword,
      removeDeviceAndContinue,
    } from '../scripts/admin-auth.js';
    import { showToast } from '../scripts/admin-utils.js';

    // ============================================================
    // LOGIN
    // ============================================================
    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const user = await login(email, password);
        showToast('Welcome!', 'success');
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        // Backend reports the account's device limit was reached.
        // Show the removal modal and hand off completion to
        // removeDeviceAndContinue().
        if (err.code === 'DEVICE_LIMIT_REACHED') {
          openDeviceLimitModal(err.deviceLimitPayload);
          return;
        }
        showToast(err.message, 'error');
      }
    });

    // ============================================================
    // DEVICE LIMIT MODAL
    // ============================================================
    function openDeviceLimitModal(payload) {
      const { devices, maxDevices, devicesUsed, switchToken } = payload || {};

      if (!switchToken || !Array.isArray(devices)) {
        showToast(
          'Device limit reached but response was incomplete.',
          'error'
        );
        return;
      }

      const modal = document.getElementById('device-limit-modal');
      const messageEl = document.getElementById('device-limit-message');
      const listEl = document.getElementById('device-limit-list');
      const closeBtn = document.getElementById('device-limit-close');
      const cancelBtn = document.getElementById('device-limit-cancel');

      const max = maxDevices ?? 1;
      const used = devicesUsed ?? devices.length;

      messageEl.innerHTML = `
        <p>Your account is already signed in on <strong>${used}</strong>
           of <strong>${max}</strong> allowed device${max === 1 ? '' : 's'}.</p>
        <p>Remove one of the devices below to continue on this one.</p>
      `;

      renderDeviceList(listEl, devices);

      const close = () => { modal.style.display = 'none'; };
      closeBtn.onclick = close;
      cancelBtn.onclick = close;

      // Wire the removal buttons
      listEl.querySelectorAll('.btn-remove-device').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const deviceToRemoveId = btn.getAttribute('data-device-id');
          if (!deviceToRemoveId) return;

          btn.disabled = true;
          btn.textContent = 'Removing…';

          try {
            await removeDeviceAndContinue(switchToken, deviceToRemoveId);
            modal.style.display = 'none';
            showToast('Device removed. You are now signed in here.', 'success');
            window.location.href = '/pages/dashboard.html';
          } catch (err) {
            showToast(err.message || 'Could not remove device', 'error');
            btn.disabled = false;
            btn.textContent = 'Remove';
          }
        });
      });

      modal.style.display = 'flex';
    }

    function renderDeviceList(listEl, devices) {
      if (!listEl) return;

      listEl.innerHTML = (devices || []).map((d) => {
        const name = d.deviceName || d.deviceId || 'Unknown device';
        const platform = d.platform || 'unknown';
        const lastSeen = formatRelativeTime(d.lastSeen);
        const current = d.isCurrent
          ? '<span class="device-current">This device</span>'
          : '';
        const removeBtn = d.isCurrent
          ? '<span class="device-current-note">Currently signing in here</span>'
          : `<button type="button" class="btn-outline btn-remove-device" data-device-id="${escapeHtml(d.deviceId)}">Remove</button>`;

        return `
          <li class="device-limit-item">
            <div class="device-limit-info">
              <div class="device-limit-name">${escapeHtml(name)} ${current}</div>
              <div class="device-limit-meta">${escapeHtml(platform)} · ${lastSeen}</div>
            </div>
            <div class="device-limit-actions">${removeBtn}</div>
          </li>
        `;
      }).join('');
    }

    function formatRelativeTime(ts) {
      if (!ts) return 'never';
      const diff = Date.now() - ts;
      const min = Math.floor(diff / 60000);
      if (min < 1) return 'active now';
      if (min < 60) return `${min}m ago`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}h ago`;
      const day = Math.floor(hr / 24);
      if (day < 7) return `${day}d ago`;
      const wk = Math.floor(day / 7);
      if (wk < 5) return `${wk}w ago`;
      const mo = Math.floor(day / 30);
      return `${mo}mo ago`;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ============================================================
    // FORGOT PASSWORD FLOW
    // ============================================================
    const forgotLink = document.getElementById('forgot-password-link');
    const backLink = document.getElementById('back-to-login');
    const loginCard = document.querySelector('.login-card:first-of-type');
    const forgotCard = document.getElementById('forgot-password-card');
    let resetToken = null;

    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      loginCard.style.display = 'none';
      forgotCard.style.display = 'block';
    });
    backLink.addEventListener('click', (e) => {
      e.preventDefault();
      forgotCard.style.display = 'none';
      loginCard.style.display = 'block';
      // Reset steps
      document.getElementById('step-email').style.display = 'block';
      document.getElementById('step-questions').style.display = 'none';
      document.getElementById('step-new-password').style.display = 'none';
    });

    document.getElementById('get-questions-btn').addEventListener('click', async () => {
      const email = document.getElementById('reset-email').value;
      if (!email) return showToast('Email required', 'error');
      try {
        const questions = await forgotPassword(email);
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        questions.forEach((q, idx) => {
          container.innerHTML += `<div class="form-group"><label>${q}</label><input type="text" class="security-answer"></div>`;
        });
        document.getElementById('step-email').style.display = 'none';
        document.getElementById('step-questions').style.display = 'block';
      } catch (err) { showToast(err.message, 'error'); }
    });

    document.getElementById('verify-answers-btn').addEventListener('click', async () => {
      const answers = Array.from(document.querySelectorAll('.security-answer')).map(input => input.value);
      try {
        const result = await verifyAnswers(answers);
        resetToken = result.resetToken;
        document.getElementById('step-questions').style.display = 'none';
        document.getElementById('step-new-password').style.display = 'block';
      } catch (err) { showToast(err.message, 'error'); }
    });

    document.getElementById('reset-password-btn').addEventListener('click', async () => {
      const newPassword = document.getElementById('new-password').value;
      if (!newPassword || newPassword.length < 6) return showToast('Minimum 6 characters', 'error');
      try {
        await resetPassword(newPassword, resetToken);
        showToast('Password reset. Please login.', 'success');
        // Go back to login
        backLink.click();
      } catch (err) { showToast(err.message, 'error'); }
    });
  </script>
</body>
</html>
