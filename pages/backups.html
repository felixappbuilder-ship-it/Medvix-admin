<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backups - Admin</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/backups.css">
</head>
<body data-page="backups">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div class="mobile-top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h1>Backups</h1>
      <button id="theme-toggle" class="btn-secondary btn-sm">🌓</button>
    </div>
    <div class="page-header">
      <h1>Database Backups</h1>
      <div class="header-actions">
        <button id="theme-toggle-desktop" class="btn-secondary btn-sm">🌓 Theme</button>
        <button id="logout-btn" class="btn-secondary btn-sm">Logout</button>
      </div>
    </div>

    <div class="card">
      <button id="trigger-backup-btn" class="btn-primary">Trigger Manual Backup</button>
    </div>

    <div class="card">
      <h3>Available Backups</h3>
      <div id="backups-list"></div>
    </div>
  </div>

  <script type="module">
    import { initApp } from '../scripts/admin.js';
    import { query, call } from '../scripts/admin-api.js';
    import { showToast, formatDate } from '../scripts/admin-utils.js';

    initApp();
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
    document.getElementById('theme-toggle-desktop')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('adminTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    async function loadBackups() {
      try {
        const data = await query('admin/queries:adminListBackups');
        const container = document.getElementById('backups-list');
        if (data.backups && data.backups.length > 0) {
          let html = '<ul>';
          data.backups.forEach(b => {
            html += `<li>${formatDate(b.timestamp)} - ${b.status} <button onclick="alert('Restore not implemented')">Restore</button></li>`;
          });
          html += '</ul>';
          container.innerHTML = html;
        } else {
          container.innerHTML = '<p>No backups available.</p>';
        }
      } catch (err) { showToast(err.message, 'error'); }
    }
    loadBackups();

    document.getElementById('trigger-backup-btn').addEventListener('click', async () => {
      try {
        await call('admin/actions:adminTriggerBackup');
        showToast('Backup triggered', 'success');
        loadBackups();
      } catch (err) { showToast(err.message, 'error'); }
    });
  </script>
</body>
</html>
