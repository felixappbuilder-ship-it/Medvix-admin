<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Admin</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/settings.css">
</head>
<body data-page="settings">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div class="mobile-top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h1>Settings</h1>
      <button id="theme-toggle" class="btn-secondary btn-sm">🌓</button>
    </div>
    <div class="page-header">
      <h1>System Configuration</h1>
      <div class="header-actions">
        <button id="theme-toggle-desktop" class="btn-secondary btn-sm">🌓 Theme</button>
        <button id="logout-btn" class="btn-secondary btn-sm">Logout</button>
      </div>
    </div>

    <div class="card">
      <h3>Subscription Plans</h3>
      <form id="plans-form">
        <div class="form-group">
          <label>Monthly Price (KES)</label>
          <input type="number" id="monthly-price">
        </div>
        <div class="form-group">
          <label>Quarterly Price (KES)</label>
          <input type="number" id="quarterly-price">
        </div>
        <div class="form-group">
          <label>Yearly Price (KES)</label>
          <input type="number" id="yearly-price">
        </div>
        <button type="submit" class="btn-primary">Update Plans</button>
      </form>
    </div>

    <div class="card">
      <h3>Trial Duration (hours)</h3>
      <input type="number" id="trial-duration" min="1">
      <button id="update-trial-btn" class="btn-primary">Save</button>
    </div>

    <div class="card">
      <h3>System Lockdown</h3>
      <button id="toggle-lockdown" class="btn-danger">Enable Lockdown</button>
    </div>
  </div>

  <script type="module">
    import { initApp } from '../scripts/admin.js';
    import { call, query } from '../scripts/admin-api.js';
    import { showToast } from '../scripts/admin-utils.js';

    initApp();
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
    document.getElementById('theme-toggle-desktop')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('adminTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    async function loadConfig() {
      try {
        const config = await query('admin/queries:adminGetAppConfig');
        document.getElementById('monthly-price').value = config.plans.monthly.price;
        document.getElementById('quarterly-price').value = config.plans.quarterly.price;
        document.getElementById('yearly-price').value = config.plans.yearly.price;
        document.getElementById('trial-duration').value = config.trialDurationHours;
      } catch (err) { showToast(err.message, 'error'); }
    }
    loadConfig();

    document.getElementById('plans-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const updates = {
        plans: {
          monthly: { price: parseInt(document.getElementById('monthly-price').value) },
          quarterly: { price: parseInt(document.getElementById('quarterly-price').value) },
          yearly: { price: parseInt(document.getElementById('yearly-price').value) },
        }
      };
      try {
        await call('admin/mutations:adminUpdateAppConfig', { config: updates });
        showToast('Plans updated', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });

    document.getElementById('update-trial-btn').addEventListener('click', async () => {
      const duration = parseInt(document.getElementById('trial-duration').value);
      try {
        await call('admin/mutations:adminUpdateAppConfig', { config: { trialDurationHours: duration } });
        showToast('Trial duration updated', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });

    document.getElementById('toggle-lockdown').addEventListener('click', async () => {
      try {
        const config = await query('admin/queries:adminGetAppConfig');
        const newState = !config.maintenanceMode;
        await call('admin/mutations:adminSystemLockdown', { enabled: newState });
        showToast(`Lockdown ${newState ? 'enabled' : 'disabled'}`, 'success');
        document.getElementById('toggle-lockdown').textContent = newState ? 'Disable Lockdown' : 'Enable Lockdown';
      } catch (err) { showToast(err.message, 'error'); }
    });
  </script>
</body>
</html>
